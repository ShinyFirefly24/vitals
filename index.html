/* ---------------- Doctor report ---------------- */
let repLog = true;
function renderReport(){
  const days = rangeDays(), dset = new Set(days), inR = e => dset.has(dayKey(e.ts));
  const rangeTxt = `${fmtDay(days[0], { month:"short", day:"numeric", year:"numeric" })} – ${fmtDay(days[days.length-1], { month:"short", day:"numeric", year:"numeric" })}`;
  const rd = S.readings.filter(inR).sort(byTsDesc);
  const bpR = rd.filter(r => r.sys != null), hrR = rd.filter(r => r.hr != null);
  const sysD = groupDaily(bpR, r => r.sys, "avg", days), diaD = groupDaily(bpR, r => r.dia, "avg", days), hrD = groupDaily(hrR, r => r.hr, "avg", days);
  const aSys = avg(bpR.map(r => r.sys)), aDia = avg(bpR.map(r => r.dia));
  // AM / PM averages
  const am = bpR.filter(r => new Date(r.ts).getHours() < 12), pm = bpR.filter(r => new Date(r.ts).getHours() >= 12);
  const bpAvgTxt = a => a.length ? `${fmtNum(avg(a.map(r => r.sys)))}/${fmtNum(avg(a.map(r => r.dia)))}` : "—";
  // category split
  const cats = [["Normal","good","var(--good)"],["Elevated","warn","#e0b030"],["Stage 1","serious","#e07a3a"],["Stage 2","crit","var(--crit)"],["Hypertensive crisis","crit","#8f1d1d"],["Low","info","var(--info)"]];
  const cc = {}; bpR.forEach(r => { const c = bpCat(r.sys, r.dia).label; cc[c] = (cc[c]||0) + 1; });
  // adherence
  let due = 0, tk = 0, adh = {}; days.forEach(k => { const a = adherenceFor(k); if (a){ due += a.due; tk += a.taken; adh[k] = a.pct; } });
  const medAdh = m => { let d = 0, t = 0; if (!m.times || !m.times.length) return null; days.forEach(k => { if ((m.created||0) > dayEnd(k)) return; if (!m.active && (!m.stoppedAt || m.stoppedAt < dayStart(k))) return; const log = S.medLog[k] || {}; m.times.forEach(s => { d++; if (log[`${m.id}|${s}`]) t++; }); }); return d ? Math.round(t/d*100) : null; };
  const prnCount = m => Object.entries(S.medLog).filter(([k]) => dset.has(k)).reduce((a, [, l]) => a + Object.keys(l).filter(x => x.startsWith(m.id + "|prn-")).length, 0);
  const meds = S.meds.filter(m => m.active || (m.stoppedAt && m.stoppedAt >= dayStart(days[0])));

  let h = `<div class="page-head no-print"><div><h1>Doctor report</h1><p class="sub">A one-page summary to print, save as PDF, or share as an image.</p></div><a class="btn ghost" href="#trends">Back</a></div>
  <section class="card no-print" style="margin-bottom:14px"><div class="form-grid" style="align-items:end">
    <label class="field"><span>Name on report</span><input type="text" data-change="rep-name" value="${esc(S.settings.reportName||"")}" placeholder="Optional"></label>
    <div class="field wide"><span>Date range</span><div class="seg" role="group" aria-label="Date range">${[["7","7D"],["30","30D"],["90","90D"],["365","1Y"],["all","All"]].map(([v,l]) => `<button type="button" data-action="range" data-v="${v}" aria-pressed="${range===v}">${l}</button>`).join("")}</div></div>
    <label class="checkline full"><span class="switch"><input type="checkbox" data-change="rep-log" ${repLog ? "checked" : ""}></span>Include every reading (detailed log)</label>
    <div class="form-actions" style="justify-content:flex-start">
      <button class="btn primary" data-action="rep-pdf">Save as PDF / Print</button>
      <button class="btn" data-action="rep-img">Save as image (PNG)</button>
    </div></div>
    <p class="hint">For PDF, choose “Save as PDF” as the destination in the print dialog.</p></section>

  <article class="report" id="report">
    <div class="rep-head"><div><h2>Health summary</h2>${S.settings.reportName ? `<div class="who">${esc(S.settings.reportName)}</div>` : ""}</div>
      <div class="meta"><strong>${rangeTxt}</strong><br>${days.length} days · generated ${new Date().toLocaleDateString([], { month:"short", day:"numeric", year:"numeric" })}</div></div>

    <div class="rep-sec"><h3>Blood pressure &amp; heart rate</h3>
      <div class="rep-grid">${stat("Average BP", bpR.length ? `${fmtNum(aSys)}/${fmtNum(aDia)}` : "—", "mmHg")}${stat("Morning avg", bpAvgTxt(am))}${stat("Evening avg", bpAvgTxt(pm))}${stat("Readings", bpR.length)}
      ${stat("Highest", bpR.length ? (r => `${r.sys}/${r.dia}`)(bpR.reduce((a,b) => b.sys > a.sys ? b : a)) : "—")}${stat("Lowest", bpR.length ? (r => `${r.sys}/${r.dia}`)(bpR.reduce((a,b) => b.sys < a.sys ? b : a)) : "—")}${stat("Avg heart rate", hrR.length ? fmtNum(avg(hrR.map(r => r.hr))) : "—", "bpm")}${stat("HR range", hrR.length ? `${Math.min(...hrR.map(r => r.hr))}–${Math.max(...hrR.map(r => r.hr))}` : "—", "bpm")}</div>
      ${bpR.length ? `<div style="margin-top:10px"><div class="bar-split">${cats.filter(c => cc[c[0]]).map(c => `<i style="width:${cc[c[0]]/bpR.length*100}%; background:${c[2]}"></i>`).join("")}</div>
        <div class="split-legend">${cats.filter(c => cc[c[0]]).map(c => `<span><i class="dot" style="background:${c[2]}"></i>${c[0]}: ${cc[c[0]]} (${Math.round(cc[c[0]]/bpR.length*100)}%)</span>`).join("")}</div></div>` : ""}
    </div>

    <div class="rep-sec rep-charts">
      <div class="full"><h4>Blood pressure — daily average (mmHg)</h4><div class="legend"><span><i style="background:var(--s1)"></i>Systolic</span><span><i style="background:var(--s2)"></i>Diastolic</span></div>${chartHost("r-bp", 200)}</div>
      <div><h4>Heart rate — daily average (bpm)</h4>${chartHost("r-hr", 150)}</div>
      ${S.meds.some(m => m.times && m.times.length) ? `<div><h4>Medication adherence (% of doses)</h4>${chartHost("r-med", 150)}</div>` : ""}
    </div>

    <div class="rep-sec"><h3>Medications</h3>
      ${meds.length ? `<table><thead><tr><th>Medication</th><th>Dose</th><th>Schedule</th><th class="num">Taken</th><th>Notes</th></tr></thead><tbody>${meds.map(m => { const a = medAdh(m), p = prnCount(m); return `<tr><td><strong>${esc(m.name)}</strong>${m.active ? "" : ` <span class="chip">Stopped</span>`}</td><td>${esc(m.dose||"")}</td><td>${m.times && m.times.length ? m.times.map(fmtSlot).join(", ") : "As needed"}</td><td class="num">${a != null ? a + "%" : p ? `${p}× used` : "—"}</td><td class="row-sub">${esc(m.notes||"")}</td></tr>`; }).join("")}</tbody></table>
      ${due ? `<p class="hint">Overall: ${tk} of ${due} scheduled doses marked taken (${Math.round(tk/due*100)}%).</p>` : ""}` : `<p class="empty">No medications recorded.</p>`}
    </div>`;

  // Other tracked data
  const other = [];
  if (S.settings.water.enabled){ const d = groupDaily(S.water, w => mlToDisp(w.ml), "sum", days), v = Object.values(d); if (v.length) other.push([`Water (${wUnit()}/day)`, fmtNum(avg(v)), `${fmtNum(Math.min(...v))}–${fmtNum(Math.max(...v))}`, `${v.length} days logged`]); }
  if (S.settings.exercise.enabled){ const ex = S.exercise.filter(inR); if (ex.length){ const d = groupDaily(ex, x => +x.minutes||0, "sum", days), v = Object.values(d); const types = {}; ex.forEach(x => types[x.type] = (types[x.type]||0) + 1); other.push(["Exercise (min/active day)", fmtNum(avg(v)), `${fmtNum(sum(v))} min total`, `${v.length} active days · ${Object.entries(types).sort((a,b) => b[1]-a[1]).slice(0,3).map(t => esc(t[0])).join(", ")}`]); } }
  enabledMetrics().forEach(m => { const ent = S.metricLog.filter(e => e.metricId === m.id && inR(e)).sort((a,b) => a.ts - b.ts); if (!ent.length) return; const d = groupDaily(ent, e => e.value, m.agg, days), v = days.map(k => d[k]).filter(x => x != null); const ch = v.length > 1 ? v[v.length-1] - v[0] : null; other.push([`${esc(m.name)}${m.unit ? ` (${esc(m.unit)})` : ""}`, fmtNum(avg(v), m.decimals), `${fmtNum(Math.min(...v), m.decimals)}–${fmtNum(Math.max(...v), m.decimals)}`, `latest ${fmtNum(ent[ent.length-1].value, m.decimals)}${ch != null ? ` · change ${ch > 0 ? "+" : ""}${fmtNum(ch, m.decimals)}` : ""}`]); });
  if (other.length) h += `<div class="rep-sec"><h3>Other tracked data</h3><table><thead><tr><th>Measure</th><th class="num">Daily avg</th><th class="num">Range</th><th>Details</th></tr></thead><tbody>${other.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="row-sub">${r[3]}</td></tr>`).join("")}</tbody></table></div>`;

  if (repLog && rd.length) h += `<div class="rep-sec" style="break-inside:auto; page-break-inside:auto"><h3>All readings (${rd.length})</h3><table><thead><tr><th>Date</th><th>Time</th><th class="num">BP</th><th class="num">HR</th><th>Category</th><th>Note</th></tr></thead><tbody>${rd.map(r => `<tr><td>${fmtDay(dayKey(r.ts), { weekday:"short", month:"short", day:"numeric" })}</td><td>${fmtTime(r.ts)}</td><td class="num">${r.sys != null ? `${r.sys}/${r.dia}` : "—"}</td><td class="num">${r.hr ?? "—"}</td><td>${r.sys != null ? esc(bpCat(r.sys, r.dia).label) : ""}</td><td class="row-sub">${esc(r.note||"")}</td></tr>`).join("")}</tbody></table></div>`;

  h += `<div class="rep-foot">Self-recorded at home with the Vitals app. BP categories follow ACC/AHA adult ranges (Normal &lt;120/80 · Elevated 120–129/&lt;80 · Stage 1 130–139 or 80–89 · Stage 2 ≥140 or ≥90). Chart values are daily averages.</div>
  </article>`;
  main.innerHTML = h;

  mountChart("r-bp", "line", { days, height:200, label:"Blood pressure", unit:"mmHg", series:[{ name:"Systolic", short:"Sys", color:"var(--s1)", values:sysD }, { name:"Diastolic", short:"Dia", color:"var(--s2)", values:diaD }], refs:[{ y:120, label:"120" }, { y:80, label:"80" }], empty:"No readings in this range" });
  mountChart("r-hr", "line", { days, height:150, label:"Heart rate", unit:"bpm", series:[{ name:"Heart rate", color:"var(--s4)", values:hrD }], empty:"No readings in this range" });
  mountChart("r-med", "bar", { days, height:150, label:"Medication adherence", name:"Adherence", unit:"%", color:"var(--s1)", values:adh, max:100, empty:"No scheduled doses" });
}

async function reportToPNG(){
  const el = $("#report"); if (!el) return;
  toast("Creating image…");
  try {
    const narrow = el.offsetWidth < 760;
    el.classList.add("rep-wide"); if (narrow){ el.style.width = "820px"; el.style.maxWidth = "none"; } if (true){ charts.forEach(c => el.contains(c.el) && drawChart(c)); }
    const css = [...document.styleSheets].map(s => { try { return [...s.cssRules].map(r => r.cssText).join("\n"); } catch(e){ return ""; } }).join("\n");
    const w = el.offsetWidth, hgt = el.offsetHeight;
    const clone = el.cloneNode(true); clone.style.margin = "0"; clone.classList.add("rep-wide");
    const xhtml = new XMLSerializer().serializeToString(clone);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${hgt}"><foreignObject x="0" y="0" width="${w}" height="${hgt}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px"><style>${css}</style>${xhtml.replace(/^<article xmlns="http:\/\/www.w3.org\/1999\/xhtml"/, "<article")}</div></foreignObject></svg>`;
    const img = new Image();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    el.classList.remove("rep-wide"); if (narrow){ el.style.width = ""; el.style.maxWidth = ""; } if (true){ charts.forEach(c => el.contains(c.el) && drawChart(c)); }
    await img.decode();
    const scale = Math.min(2, 16000 / hgt);
    const cv = document.createElement("canvas"); cv.width = Math.round(w * scale); cv.height = Math.round(hgt * scale);
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0, w, hgt);
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    if (!blob) throw new Error("toBlob failed");
    const file = new File([blob], `health-summary-${todayKey()}.png`, { type:"image/png" });
    if (navigator.canShare && matchMedia("(pointer:coarse)").matches && navigator.canShare({ files:[file] })){
      try { await navigator.share({ files:[file], title:"Health summary" }); return; } catch(e){ if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("Image saved");
  } catch(err){
    console.error(err); toast("Couldn’t create the image here — try Save as PDF instead");
  }
}

function readingModal(r){
  openModal({ title:"Edit reading", fields:[
      { key:"sys", label:"Systolic", type:"number", value:r.sys }, { key:"dia", label:"Diastolic", type:"number", value:r.dia },
      { key:"hr", label:"Heart rate (bpm)", type:"number", value:r.hr }, { key:"ts", label:"Time", type:"datetime", value:toLocalInput(r.ts) },
      { key:"note", label:"Note", value:r.note, full:true } ],
    onSave: v => { const e = validateReading(v); if (typeof e === "string") return e; Object.assign(r, e); toast("Reading updated"); },
    onDelete: () => removeWithUndo("readings", r, "Reading deleted") });
}
function validateReading(v){
  const sys = num(v.sys), dia = num(v.dia), hr = num(v.hr);
  if ((sys == null) !== (dia == null)) return "Enter both systolic and diastolic.";
  if (sys == null && hr == null) return "Enter a blood pressure, a heart rate, or both.";
  if (sys != null && (sys < 40 || sys > 300 || dia < 20 || dia > 200)) return "That blood pressure looks out of range.";
  if (sys != null && dia >= sys) return "Diastolic should be lower than systolic.";
  if (hr != null && (hr < 20 || hr > 250)) return "That heart rate looks out of range.";
  return { sys: sys != null ? Math.round(sys) : null, dia: dia != null ? Math.round(dia) : null, hr: hr != null ? Math.round(hr) : null, ts: fromLocalInput(v.ts), note: v.note || "" };
}
function removeWithUndo(coll, item, msg){
  const i = S[coll].indexOf(item); if (i < 0) return;
  S[coll].splice(i, 1); save(); render();
  toast(msg, () => { S[coll].splice(i, 0, item); save(); render(); });
}
function savedToast(ts, what){ const k = dayKey(ts); toast(k === todayKey() ? `${what} saved` : `${what} saved to ${fmtDay(k)}`); }

const forms = {
  reading(f){
    const v = Object.fromEntries(new FormData(f));

    const c = bpCat(r.sys, r.dia);
    if (c && c.label === "Hypertensive crisis") window.scrollTo({ top:0, behavior:"smooth" });
  },
  water(f){

  },
  exercise(f){

};

$("#import-file").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== "object" || !("readings" in d || "meds" in d)) throw new Error("bad");

    S = migrate(d); save(); render(); toast("Backup imported");
  } catch(err){ toast("That file isn’t a Vitals backup"); }
});

function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function toCSV(){
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [["type","date","time","name","value","value2","value3","unit","note"]];
  const dt = ts => [dayKey(ts), `${pad(new Date(ts).getHours())}:${pad(new Date(ts).getMinutes())}`];
  S.readings.forEach(r => rows.push(["vitals", ...dt(r.ts), "BP sys/dia, HR", r.sys, r.dia, r.hr, "mmHg / bpm", r.note]));
  Object.entries(S.medLog).forEach(([k, log]) => Object.entries(log).forEach(([key, ts]) => { const [mid, slot] = key.split("|"); const m = S.meds.find(x => x.id === mid); rows.push(["medication", ...dt(ts), m ? m.name : "removed", m ? m.dose : "", slot.startsWith("prn") ? "as needed" : slot, "", "", ""]); }));
  S.water.forEach(w => rows.push(["water", ...dt(w.ts), "Water", Math.round(w.ml), "", "", "ml", ""]));
  S.exercise.forEach(x => rows.push(["exercise", ...dt(x.ts), x.type, x.minutes, x.intensity, "", "min", x.note]));
  S.metricLog.forEach(e => { const m = S.metrics.find(x => x.id === e.metricId); rows.push(["metric", ...dt(e.ts), m ? m.name : e.metricId, e.value, "", "", m ? m.unit : "", e.note]); });
  return rows.map(r => r.map(q).join(",")).join("\n");
}

/* Sample data for trying the app out */
function sampleData(){
  const s = defaultState(); const rnd = (a, b) => a + Math.random() * (b - a); const today = todayKey();
  s.settings.water.goal = 2000;
  const start = addDays(today, -89);
  s.meds = [
    { id:"m1", name:"Lisinopril", dose:"10 mg", times:["08:00"], notes:"Morning, with water", active:true, created:dayStart(start) },
    { id:"m2", name:"Metoprolol", dose:"25 mg", times:["08:00","20:00"], notes:"", active:true, created:dayStart(start) },
    { id:"m3", name:"Ibuprofen", dose:"200 mg", times:[], notes:"For headaches", active:true, created:dayStart(start) },
  ];
  ["weight","sleep"].forEach(id => s.metrics.find(m => m.id === id).enabled = true);
  s.metrics.push({ id:"cmood", name:"Energy level", unit:"/10", agg:"avg", decimals:0, goal:null, preset:false, enabled:true });
  let w = 192;
  dayRange(start, today).forEach((k, i) => {
    const base = dayStart(k), drift = i / 90;
    const isToday = k === today, nowT = Date.now();
    const at = (h, m=0) => base + (h*60 + m) * 60000;
    const n = Math.random() < .7 ? 1 : 2;
    for (let j = 0; j < n; j++){ const ts = at(j ? 20 : 7, Math.floor(rnd(0,50))); if (isToday && ts > nowT) continue;
      s.readings.push({ id:uid(), ts, sys:Math.round(rnd(128,142) - drift*12), dia:Math.round(rnd(80,90) - drift*7), hr:Math.round(rnd(62,78) - drift*4), note:"" }); }
    const log = {};
    s.meds.forEach(m => m.times.forEach(t => { const [hh, mm] = t.split(":").map(Number); const ts = at(hh, mm + Math.floor(rnd(0,40))); if (isToday && ts > nowT) return; if (Math.random() < .9) log[`${m.id}|${t}`] = ts; }));
    if (Math.random() < .08) log[`m3|prn-${uid()}`] = at(14);
    if (Object.keys(log).length) s.medLog[k] = log;
    const glasses = Math.floor(rnd(4, 10)); for (let j = 0; j < glasses; j++){ const ts = at(8 + j*1.5); if (!(isToday && ts > nowT)) s.water.push({ id:uid(), ts, ml:250 }); }
    if (Math.random() < .6){ const ts = at(17, 30); if (!(isToday && ts > nowT)) s.exercise.push({ id:uid(), ts, type:["Walk","Walk","Cycling","Yoga","Strength training","Swim"][Math.floor(rnd(0,6))], minutes:Math.round(rnd(4,12))*5, intensity:["Light","Moderate","Moderate","Vigorous"][Math.floor(rnd(0,4))], note:"" }); }
    w += rnd(-.35, .25); if (i % 2 === 0) s.metricLog.push({ id:uid(), metricId:"weight", ts:at(7), value:+w.toFixed(1), note:"" });
    s.metricLog.push({ id:uid(), metricId:"sleep", ts:at(7, 5), value:+rnd(5.5, 8.5).toFixed(1), note:"" });
    s.metricLog.push({ id:uid(), metricId:"cmood", ts:at(21), value:Math.round(rnd(4, 9)), note:"" });
  });
  return s;
}

function onRoute(){
  const r = (location.hash || "#today").slice(1);
  route = ["today","trends","meds","settings","report"].includes(r) ? r : "today";
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", onRoute);
window.addEventListener("storage", e => { if (e.key === KEY){ S = load(); render(); } });
let lastDay = todayKey();
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayKey() !== lastDay){ lastDay = todayKey(); render(); } });
onRoute();
})();
